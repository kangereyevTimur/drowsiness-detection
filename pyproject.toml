[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsiness-detection"
version = "1.0.0"
description = "Real-time human drowsiness and fatigue monitoring system based on Deep Learning (EyeCNN) and MediaPipe Face Landmarker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "KangereyevTimur", email = "kangereev.timur@gmail.com" },
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "customtkinter>=5.2.2",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
